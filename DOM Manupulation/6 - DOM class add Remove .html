<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML DOM </title>
    <style>
        .Mia{
            color: red;
            width: 50px;
            height: 20px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1 class="head">Hello World!</h1>

    <script>
        let head = document.querySelector('.head');
        // console.log(head.className);
        head.classList.add('Mia');
         
    </script>
</body>
</html>
